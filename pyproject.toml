[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "architeuthis"
version = "0.1.0"
description = "Meteorological, oceanographic, and geospatial processing library for Architeuthis."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Jules Richeux", email = "j.richeux@neoline.eu" }
]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "sympy",
    "cython",
    "casadi",
    "xarray",
    "geojson",
    "pillow",
    "seaborn",
    "flask",
    "herbie-data",
    "copernicusmarine",
    "requests",
    "dash==3.2.0",
    "dash-leaflet",
    "dash-mantine-components",
    "dash-iconify",
    "cartopy",
    "metpy",
    "netcdf4",
    "geopandas",
    "eumdac",
    "h5py",
]

[tool.setuptools.packages.find]
include = ["architeuthis*"]