[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "architeuthis"
version = "0.1.4"  # must match the release tag: v0.1.4
description = "Meteorological, oceanographic, and geospatial processing library for Architeuthis."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jules Richeux", email = "j.richeux@neoline.eu" }
]
keywords = ["meteorology", "oceanography", "geospatial", "weather routing", "xarray"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "seaborn",
    "sympy",
    "casadi",
    "xarray",
    "geojson",
    "pillow",
    "requests",
    "herbie-data",
    "copernicusmarine",
    "cartopy",
    "metpy",
    "netcdf4",
    "geopandas",
    "eumdac",
    "h5py",
    "cdsapi",
    "cfgrib",
    "pyproj",
    "sortedcontainers",
    "tqdm",
]

[project.optional-dependencies]
app = [
    "flask",
    "dash>=3.2,<4",
    "dash-extensions",
    "dash-leaflet",
    "dash-mantine-components",
    "dash-iconify",
]
test = [
    "architeuthis[app]",
    "pytest>=8",
    "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/julesricheux/Architeuthis"
Repository = "https://github.com/julesricheux/Architeuthis"
Issues = "https://github.com/julesricheux/Architeuthis/issues"

[tool.setuptools.packages.find]
include = ["architeuthis*"]
exclude = ["*tests*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# tests/modeling holds the dataset_temperature helper imported by its tests.
pythonpath = [".", "tests/modeling"]
# --tb=native: pytest's own formatters parse each source file in a traceback, and
# casadi.py is so large that this raises MemoryError and aborts the whole session.
addopts = [
    "--tb=native",
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "integration: solves a full routing problem end to end on synthetic data",
]

[tool.coverage.run]
source = ["architeuthis"]
branch = true
omit = ["*/integrate_discrete_derivations/*", "*/derivative_discrete_derivations/*"]
