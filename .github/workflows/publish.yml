name: Publish Architeuthis to PyPI

on:
  push:
    tags:
      - 'v*'  # e.g. v0.1.4

permissions:
  contents: read

jobs:
  build:
    name: Build distribution package 📦
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # Read without importing the package, whose dependencies are not installed here.
          PKG_VERSION=$(python -c "import ast; print(next(node.value.value for node in ast.parse(open('architeuthis/__init__.py', encoding='utf-8').read()).body if isinstance(node, ast.Assign) and getattr(node.targets[0], 'id', None) == '__version__'))")
          echo "tag=$TAG_VERSION package=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match architeuthis.__version__ ($PKG_VERSION)"
            exit 1
          fi

      - name: Install build dependencies
        run: python -m pip install --upgrade pip build twine

      - name: Build wheel and source tarball
        run: python -m build --outdir dist/

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Verify only the package is shipped
        run: python .github/scripts/check_dist.py architeuthis

      - name: Store distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish Python distribution 📦 to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/architeuthis
    permissions:
      id-token: write  # MANDATORY for PyPI Trusted Publishing (OIDC)

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
